# agensio configuration
# Paths are resolved relative to this file's directory.

[server]
workers = 0              # 0 = one worker per hardware thread
idle_timeout = 15        # seconds a keep-alive connection may stay idle
max_requests_per_connection = 1000  # then the server closes the connection (0 = unlimited)
max_header_size = "16KB" # request head larger than this gets a 431
max_body_size = "1MB"    # request body larger than this gets a 413 (nginx client_max_body_size)
body_timeout = 60        # seconds allowed between two reads of a request body
reuse_port = "auto"      # auto | on | off  (SO_REUSEPORT per worker; auto = on for Linux)
tcp_nodelay = true
sendfile = true          # zero-copy streaming of files above cache.max_file_size (plain HTTP)
sendfile_max_chunk = "1MB" # bytes per sendfile() call (measured: one 10 MB call costs 6x more kernel time)
server_header = "agensio"

[log]
access = "logs/access.log" # default access log for every site: a path (relative to this file) or "off";
                         # this is also the built-in default. A site can set its own `access_log = "path"`
                         # or "off". Buffered per worker, flushed each second; SIGUSR1 reopens all log
                         # files (logrotate). Measured cost: 0.1-0.2 us per request.
format = "combined"      # "combined" (Apache/nginx, fail2ban-compatible) or "json" (one object per line)
error = "stderr"         # "stderr" or a path
level = "warn"           # error | warn | info

[cache]
max_file_size = "4MB"    # larger files are streamed from disk, never cached
max_size = "256MB"       # total bytes held in memory
evict_fraction = 0.2     # when full, free this fraction (least recently used first)
revalidate_interval = 1  # seconds between stat() checks of a cached file; 0 = never
stream_chunk_size = "64KB"
sendfile_min_size = "48KB" # cached files at least this large are sent from the kernel page cache via
                         # sendfile on plain HTTP (keeps one open descriptor per such entry); below that
                         # a memory copy is cheaper. 0 disables. Measured crossover on macOS: ~48 KB.
max_open_files = 1024    # files above max_file_size are streamed, but their open descriptor and
                         # prebuilt headers stay cached (nginx open_file_cache), so a repeat request
                         # costs no open/fstat. Least recently used are closed beyond this count.
                         # 0 = open per request. Must stay well under the process file limit.

# Locations: [[site.location]] blocks under a site. `path` is a prefix ("/static/") or,
# with match = "exact", the whole path. Exact matches win, then the longest prefix; a "/"
# prefix location with the site's own settings is always present. A location may override
# root (file = root + path) or alias (file = alias + path minus the prefix, nginx alias),
# index, try_files, hidden_files and symlinks; `handler` is "static" until phase C.
# try_files = ["$uri", "$uri/", "/index.html"]  tries the file, then the directory, then
# routes the fallback path again; "=403" / "=404" answer directly. Without try_files the
# rule is: file, directory index (403 without one), 301 to the slash form, 404.

# Extra site files, e.g. one per virtual host written by a hosting panel.
include = ["sites.d/*.toml"]

[[site]]
server_name = ["localhost", "127.0.0.1"]
listen = ["0.0.0.0:8080"]
root = "../bench/www"
index = ["index.html", "index.htm"]
default = true
hidden_files = false     # never serve .env, .git/, .htaccess and other dot-paths (404)
symlinks = "allow"       # "deny" refuses files whose resolved path leaves root (one realpath per cache miss;
                         # note Laravel's public/storage link points outside public/)

