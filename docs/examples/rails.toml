# A Ruby on Rails application behind Puma on 127.0.0.1:3000 (Redmine, Discourse, your own).
# Rails builds absolute URLs from Host and X-Forwarded-Proto, both forwarded by default;
# a Location naming the Puma address is rewritten to this site. Precompiled assets are
# served from disk (public/assets) with the immutable cache Rails expects.
[[site]]
server_name = ["rails.example.com"]
listen = ["0.0.0.0:443"]
tls = { cert = "/etc/ssl/rails/fullchain.pem", key = "/etc/ssl/rails/privkey.pem" }
app = "proxy"
upstream = ["http://127.0.0.1:3000", "http://127.0.0.1:3001"]   # two Puma processes, round-robin
proxy = { read_timeout = 60, max_fails = 3, fail_timeout = 10 }

[[site.location]]
path = "/assets/"
alias = "/srv/rails/public/assets"
add_headers = { "Cache-Control" = "public, max-age=31536000, immutable" }
