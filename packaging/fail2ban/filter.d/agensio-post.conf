# fail2ban filter for agensio (docs/configuration.md 18): POST requests, whatever the path.
# The catch-all behind agensio-login for an application whose login path nobody named: the
# jail's threshold is high (a POST a second, sustained), so a user never reaches it and a
# brute-force tool does. An API clients legitimately post to that often is excluded with
# the `ignore` parameter: filter = agensio-post[ignore="/api/|/jsonrpc\.php"] in the jail.

[INCLUDES]
before = common.conf

[Init]
ignore = (?!)

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "POST \S+ HTTP/\S+" \d{3} 
ignoreregex = ^<HOST> \S+ \S+ \[\] "POST (?:<ignore>)
datepattern = ^[^\[]*\[({DATE})
