# fail2ban filter for agensio (docs/configuration.md 18): paths that do not exist, in numbers.
# A browser meets a 404 now and then; a scanner probing for wp-login.php, phpmyadmin and
# backups meets dozens a minute (the agensio presets answer those 404 themselves).

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "(?:GET|POST|HEAD) \S+ HTTP/\S+" 404 
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
