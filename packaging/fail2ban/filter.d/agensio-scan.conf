# fail2ban filter for agensio (docs/configuration.md 18): paths that do not exist, in numbers.
# A browser meets a 404 now and then; a scanner probing for wp-login.php, phpmyadmin and
# backups meets dozens a minute (the agensio presets answer those 404 themselves). A 421 is
# a name no site answers on that address: a scanner going by IP gets one per request.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "(?:GET|POST|HEAD) \S+ HTTP/\S+" (?:404|421) 
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
