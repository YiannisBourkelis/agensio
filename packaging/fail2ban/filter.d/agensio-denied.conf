# fail2ban filter for agensio (docs/configuration.md 18): requests refused with 403.
# An address outside a site's access rule, a password asked for over plain HTTP, an application
# refusing. A 401 is not counted: every browser meets one first on a password-protected path
# (agensio-auth counts the failed passwords themselves, from the error log). The line is agensio's
# vhost_combined (host:port first, the default) or combined access log: the prefix is optional.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^(?:\S+:\d+ )?<HOST> \S+ \S+ \[\] "\S+ \S+ HTTP/\S+" 403 
ignoreregex =
datepattern = ^(?:\[[^\]]*\]:\d+ )?[^\[]*\[({DATE})
