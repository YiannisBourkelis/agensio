# fail2ban filter for agensio (docs/configuration.md 18): requests refused with 401 or 403.
# HTTP authentication, API tokens and the applications that answer a failed login with 403.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[\] "\S+ \S+ HTTP/\S+" (?:401|403) 
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
