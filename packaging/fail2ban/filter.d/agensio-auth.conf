# fail2ban filter for agensio (docs/configuration.md 18, 19b): failed passwords on [[site.auth]] paths.
# One "auth failed" line in the error log per login the server refused: a wrong password, an unknown
# or locked user, malformed credentials. The challenge every browser meets first (a 401 without
# credentials) writes none, and an expired user's right password is no guess; the error log, not the
# access log, as fail2ban's own nginx-http-auth and apache-auth read theirs.

[INCLUDES]
before = common.conf

[Definition]
failregex = ^\s*\[warn\] auth failed: client <ADDR> site \S+ realm "[^"]*" user "[^"]*" \((?:wrong password|unknown user|locked user|malformed credentials)\) 
ignoreregex =
datepattern = {^LN-BEG}
