# fail2ban filter for agensio (docs/configuration.md 18): credentials posted to a login path.
# The access log is in the combined format, the client address its first field (behind a
# trusted proxy, the one X-Forwarded-For named). A form login is a POST; a failed and a
# successful one look alike in an access log, so this counts attempts: no one types ten
# passwords in ten minutes, every brute-force tool does. The jail passes this host's login
# paths as `paths` (agensio ctl protection --jail renders them from the sites' presets and
# their login_paths); the default below is every preset's. Each path is written in every
# spelling the server and the applications accept, since the log holds the request as the
# client sent it: every character literal or percent-encoded (the percent written \x25), repeated
# slashes (encoded too), ./ and seg/../ segments, any case, for a PHP preset an optional
# /index.php front controller before the path and path info after a .php file, for a Rails
# application an optional .format suffix, and for a login routed through the query string its
# parameters in any order with others allowed. The grammar is unambiguous, so a long request
# line costs linear time. agensio ctl protection renders the same from each site's paths, one
# agensio-login jail per access log.

[INCLUDES]
before = common.conf

[Init]
# <sep>: a path separator as a client may write it: slashes, literal or encoded, then any
# number of ./ runs and seg/../ pops; unambiguous, so a long line costs linear time.
sep = (?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*
paths = (?:<sep>index(?:\.|\x252E)php)?<sep>(?:a|\x25[46]1)(?:d|\x25[46]4)(?:m|\x25[46]D)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|<sep>(?:a|\x25[46]1)(?:d|\x25[46]4)(?:m|\x25[46]D)(?:i|\x25[46]9)(?:n|\x25[46]E)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:c|\x25[46]3)(?:p|\x25[57]0)<sep>(?:a|\x25[46]1)(?:u|\x25[57]5)(?:t|\x25[57]4)(?:h|\x25[46]8)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|<sep>(?:d|\x25[46]4)(?:j|\x25[46]A)(?:a|\x25[46]1)(?:n|\x25[46]E)(?:g|\x25[46]7)(?:o|\x25[46]F)(?:-|\x252D)(?:a|\x25[46]1)(?:d|\x25[46]4)(?:m|\x25[46]D)(?:i|\x25[46]9)(?:n|\x25[46]E)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:(?:\.|\x252E)[a-z0-9]{1,8})?(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:u|\x25[57]5)(?:s|\x25[57]3)(?:e|\x25[46]5)(?:r|\x25[57]2)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:w|\x25[57]7)(?:p|\x25[57]0)(?:-|\x252D)(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:\.|\x252E)(?:p|\x25[57]0)(?:h|\x25[46]8)(?:p|\x25[57]0)(?:(?:/|\x252F)+[^?\s]*)?(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:x|\x25[57]8)(?:m|\x25[46]D)(?:l|\x25[46]C)(?:r|\x25[57]2)(?:p|\x25[57]0)(?:c|\x25[46]3)(?:\.|\x252E)(?:p|\x25[57]0)(?:h|\x25[46]8)(?:p|\x25[57]0)(?:(?:/|\x252F)+[^?\s]*)?(?:[?&]\S*)?

[Definition]
failregex = (?i)^<HOST> \S+ \S+ \[\] "POST (?:<paths>) HTTP/\S+" \d{3} 
ignoreregex =
datepattern = ^[^\[]*\[({DATE})
