# fail2ban filter for agensio (docs/configuration.md 18): credentials posted to a login path.
# The access log is in the combined format, the client address its first field (behind a
# trusted proxy, the one X-Forwarded-For named). A form login is a POST; a failed and a
# successful one look alike in an access log, so this counts attempts: no one types ten
# passwords in ten minutes, every brute-force tool does. The jail passes this host's login
# paths as `paths` (agensio ctl protection --jail renders them from the sites' presets and
# their login_paths); the default below is every preset's. Each path is written in every
# spelling the server and the applications accept, since the log holds the request as the
# client sent it: every character literal or percent-encoded (the percent written \x25), repeated
# slashes, ./ and seg/../ segments, an optional /index.php front controller, a trailing slash,
# a .format suffix, any case, and for a login routed through the query string its parameters
# in any order with others allowed. agensio ctl protection renders the same from a path.

[INCLUDES]
before = common.conf

[Init]
paths = (?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:c|\x2563)(?:p|\x2570)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:u|\x2575)(?:t|\x2574)(?:h|\x2568)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:c|\x2563)(?:p|\x2570)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:u|\x2575)(?:t|\x2574)(?:h|\x2568)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:d|\x2564)(?:j|\x256A)(?:a|\x2561)(?:n|\x256E)(?:g|\x2567)(?:o|\x256F)(?:-|\x252D)(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:d|\x2564)(?:j|\x256A)(?:a|\x2561)(?:n|\x256E)(?:g|\x2567)(?:o|\x256F)(?:-|\x252D)(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)p