# agensio: fail2ban jails over its access logs (docs/configuration.md 18), rendered by
# `agensio ctl protection --jail` for this host: its web ports, its access logs and the login
# paths of its sites (each preset's, plus every site's login_paths). Install as
# /etc/fail2ban/jail.d/agensio.conf with the filters from /usr/share/agensio/fail2ban/filter.d, then
# `fail2ban-client reload`; render again when a site is added (health says when this file is stale).
# The logs are in the combined format: the client address is the first field (behind a trusted
# proxy, the one X-Forwarded-For named). Bans go through nftables into fail2ban's own table;
# a host whose firewall is managed otherwise sets banaction in its jail.local.

[agensio-login]
# Credentials posted to a login path: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-login[paths="(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:c|\x2563)(?:p|\x2570)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:u|\x2575)(?:t|\x2574)(?:h|\x2568)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:c|\x2563)(?:p|\x2570)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:a|\x2561)(?:u|\x2575)(?:t|\x2574)(?:h|\x2568)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:d|\x2564)(?:j|\x256A)(?:a|\x2561)(?:n|\x256E)(?:g|\x2567)(?:o|\x256F)(?:-|\x252D)(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:d|\x2564)(?:j|\x256A)(?:a|\x2561)(?:n|\x256E)(?:g|\x2567)(?:o|\x256F)(?:-|\x252D)(?:a|\x2561)(?:d|\x2564)(?:m|\x256D)(?:i|\x2569)(?:n|\x256E)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:u|\x2575)(?:s|\x2573)(?:e|\x2565)(?:r|\x2572)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:u|\x2575)(?:s|\x2573)(?:e|\x2565)(?:r|\x2572)/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:w|\x2577)(?:p|\x2570)(?:-|\x252D)(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E)(?:\.|\x252E)(?:p|\x2570)(?:h|\x2568)(?:p|\x2570))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:w|\x2577)(?:p|\x2570)(?:-|\x252D)(?:l|\x256C)(?:o|\x256F)(?:g|\x2567)(?:i|\x2569)(?:n|\x256E)(?:\.|\x252E)(?:p|\x2570)(?:h|\x2568)(?:p|\x2570))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?|(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*index(?:\.|\x252E)php(?:/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:x|\x2578)(?:m|\x256D)(?:l|\x256C)(?:r|\x2572)(?:p|\x2570)(?:c|\x2563)(?:\.|\x252E)(?:p|\x2570)(?:h|\x2568)(?:p|\x2570))?|/+(?:(?:\.|[^/?\s]+/+\.\.)/+)*(?:x|\x2578)(?:m|\x256D)(?:l|\x256C)(?:r|\x2572)(?:p|\x2570)(?:c|\x2563)(?:\.|\x252E)(?:p|\x2570)(?:h|\x2568)(?:p|\x2570))(?:(?:\.|\x252E)[a-z0-9]{1,8})?/*(?:[?&]\S*)?"]
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-auth]
# Requests refused with 401 or 403: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-auth
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-scan]
# Paths that do not exist: forty in five minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-scan
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 40
findtime  = 5m
bantime   = 1h

[agensio-post]
# POST requests to any path, the catch-all for an unnamed login: 120 in two minutes bans for
# half an hour. An API posted to that often: filter = agensio-post[ignore="/api/|/jsonrpc\.php"].
enabled   = true
port      = 80,443
filter    = agensio-post
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 120
findtime  = 2m
bantime   = 30m
