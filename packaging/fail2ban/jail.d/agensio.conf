# agensio: fail2ban jails over its access logs (docs/configuration.md 18), rendered by
# `agensio ctl protection --jail` for this host: its web ports, its access logs and the login
# paths of its sites (each preset's, plus every site's login_paths). Install as
# /etc/fail2ban/jail.d/agensio.conf with the filters from /usr/share/agensio/fail2ban/filter.d, then
# `fail2ban-client reload`; render again when a site is added (health says when this file is stale).
# The logs are in the combined format: the client address is the first field (behind a trusted
# proxy, the one X-Forwarded-For named). Bans go through nftables into fail2ban's own table;
# a host whose firewall is managed otherwise sets banaction in its jail.local.

[agensio-login]
# Credentials posted to a login path: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-login[paths="/admin|/admin/login/|/cp/auth/login|/django-admin/login/|/login|/user/login|/wp-login\.php"]
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-auth]
# Requests refused with 401 or 403: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-auth
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-scan]
# Paths that do not exist: forty in five minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-scan
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 40
findtime  = 5m
bantime   = 1h

[agensio-post]
# POST requests to any path, the catch-all for an unnamed login: 120 in two minutes bans for
# half an hour. An API posted to that often: filter = agensio-post[ignore="/api/|/jsonrpc\.php"].
enabled   = true
port      = 80,443
filter    = agensio-post
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 120
findtime  = 2m
bantime   = 30m
