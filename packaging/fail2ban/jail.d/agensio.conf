# agensio: fail2ban jails over its access logs and its error log (docs/configuration.md 18), rendered by
# `agensio ctl protection --jail` for this host: its web ports, its logs and the login
# paths of its sites (each preset's, plus every site's login_paths), one login jail per log, and for a
# preset whose application logs its failed logins (WordPress with the WP fail2ban plugin, Drupal with its
# Syslog module) a jail over that log, counting failures rather than attempts. Install as
# /etc/fail2ban/jail.d/agensio.conf with the filters from /usr/share/agensio/fail2ban/filter.d, then
# `fail2ban-client reload`; render again when a site is added (health says when this file is stale).
# The access logs are in the combined format: the client address is the first field (behind a trusted
# proxy, the one X-Forwarded-For named), as in the error log's lines. Bans go through nftables into fail2ban's own table;
# a host whose firewall is managed otherwise sets banaction in its jail.local.

[agensio-login]
# Credentials posted to a login path: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-login[paths="(?:<sep>index(?:\.|\x252E)php)?<sep>(?:a|\x25[46]1)(?:d|\x25[46]4)(?:m|\x25[46]D)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|<sep>(?:a|\x25[46]1)(?:d|\x25[46]4)(?:m|\x25[46]D)(?:i|\x25[46]9)(?:n|\x25[46]E)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:c|\x25[46]3)(?:p|\x25[57]0)<sep>(?:a|\x25[46]1)(?:u|\x25[57]5)(?:t|\x25[57]4)(?:h|\x25[46]8)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|<sep>(?:d|\x25[46]4)(?:j|\x25[46]A)(?:a|\x25[46]1)(?:n|\x25[46]E)(?:g|\x25[46]7)(?:o|\x25[46]F)(?:-|\x252D)(?:a|\x25[46]1)(?:d|\x25[46]4)(?:m|\x25[46]D)(?:i|\x25[46]9)(?:n|\x25[46]E)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:(?:\.|\x252E)[a-z0-9]{1,8})?(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:u|\x25[57]5)(?:s|\x25[57]3)(?:e|\x25[46]5)(?:r|\x25[57]2)<sep>(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:/|\x252F)*(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:w|\x25[57]7)(?:p|\x25[57]0)(?:-|\x252D)(?:l|\x25[46]C)(?:o|\x25[46]F)(?:g|\x25[46]7)(?:i|\x25[46]9)(?:n|\x25[46]E)(?:\.|\x252E)(?:p|\x25[57]0)(?:h|\x25[46]8)(?:p|\x25[57]0)(?:(?:/|\x252F)+[^?\s]*)?(?:[?&]\S*)?|(?:<sep>index(?:\.|\x252E)php)?<sep>(?:x|\x25[57]8)(?:m|\x25[46]D)(?:l|\x25[46]C)(?:r|\x25[57]2)(?:p|\x25[57]0)(?:c|\x25[46]3)(?:\.|\x252E)(?:p|\x25[57]0)(?:h|\x25[46]8)(?:p|\x25[57]0)(?:(?:/|\x252F)+[^?\s]*)?(?:[?&]\S*)?"]
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-auth]
# Failed passwords on [[site.auth]] paths, the error log's "auth failed" lines (never the challenge
# every browser meets first): ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-auth
logpath   = /var/log/agensio/error.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-denied]
# Requests refused with 403 (an address outside a site's access rule, an application refusing): ten in ten
# minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-denied
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-scan]
# Paths that do not exist: forty in five minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-scan
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 40
findtime  = 5m
bantime   = 1h

[agensio-post]
# POST requests to any path, the catch-all for an unnamed login: 120 in two minutes bans for
# half an hour. An API posted to that often: filter = agensio-post[ignore="/api/|/jsonrpc\.php"].
enabled   = true
port      = 80,443
filter    = agensio-post
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 120
findtime  = 2m
bantime   = 30m
