# agensio: fail2ban jails over its access logs (docs/configuration.md 18), rendered by
# `agensio ctl protection --jail` for this host: its web ports, its access logs and the login
# paths of its sites (each preset's, plus every site's login_paths), one login jail per log. Install as
# /etc/fail2ban/jail.d/agensio.conf with the filters from /usr/share/agensio/fail2ban/filter.d, then
# `fail2ban-client reload`; render again when a site is added (health says when this file is stale).
# The logs are in the combined format: the client address is the first field (behind a trusted
# proxy, the one X-Forwarded-For named). Bans go through nftables into fail2ban's own table;
# a host whose firewall is managed otherwise sets banaction in its jail.local.

[agensio-login]
# Credentials posted to a login path: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-login[paths="(?:(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*index(?:\.|\x252E)php)?(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:a|\x2561|\x2541)(?:d|\x2564|\x2544)(?:m|\x256D|\x254D)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)*(?:[?&]\S*)?|(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:a|\x2561|\x2541)(?:d|\x2564|\x2544)(?:m|\x256D|\x254D)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:l|\x256C|\x254C)(?:o|\x256F|\x254F)(?:g|\x2567|\x2547)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)*(?:[?&]\S*)?|(?:(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*index(?:\.|\x252E)php)?(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:c|\x2563|\x2543)(?:p|\x2570|\x2550)(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:a|\x2561|\x2541)(?:u|\x2575|\x2555)(?:t|\x2574|\x2554)(?:h|\x2568|\x2548)(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:l|\x256C|\x254C)(?:o|\x256F|\x254F)(?:g|\x2567|\x2547)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)*(?:[?&]\S*)?|(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:d|\x2564|\x2544)(?:j|\x256A|\x254A)(?:a|\x2561|\x2541)(?:n|\x256E|\x254E)(?:g|\x2567|\x2547)(?:o|\x256F|\x254F)(?:-|\x252D)(?:a|\x2561|\x2541)(?:d|\x2564|\x2544)(?:m|\x256D|\x254D)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:l|\x256C|\x254C)(?:o|\x256F|\x254F)(?:g|\x2567|\x2547)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)*(?:[?&]\S*)?|(?:(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*index(?:\.|\x252E)php)?(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:l|\x256C|\x254C)(?:o|\x256F|\x254F)(?:g|\x2567|\x2547)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:(?:\.|\x252E)[a-z0-9]{1,8})?(?:/|\x252F)*(?:[?&]\S*)?|(?:(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*index(?:\.|\x252E)php)?(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:u|\x2575|\x2555)(?:s|\x2573|\x2553)(?:e|\x2565|\x2545)(?:r|\x2572|\x2552)(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:l|\x256C|\x254C)(?:o|\x256F|\x254F)(?:g|\x2567|\x2547)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:/|\x252F)*(?:[?&]\S*)?|(?:(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*index(?:\.|\x252E)php)?(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:w|\x2577|\x2557)(?:p|\x2570|\x2550)(?:-|\x252D)(?:l|\x256C|\x254C)(?:o|\x256F|\x254F)(?:g|\x2567|\x2547)(?:i|\x2569|\x2549)(?:n|\x256E|\x254E)(?:\.|\x252E)(?:p|\x2570|\x2550)(?:h|\x2568|\x2548)(?:p|\x2570|\x2550)(?:(?:/|\x252F)+\S*)?(?:[?&]\S*)?|(?:(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*index(?:\.|\x252E)php)?(?:/|\x252F)+(?:(?:(?:\.|\x252E)(?:/|\x252F)+|[^/?\s.\x25][^/?\s\x25]*(?:/|\x252F)+(?:\.|\x252E)(?:\.|\x252E)(?:/|\x252F)+))*(?:x|\x2578|\x2558)(?:m|\x256D|\x254D)(?:l|\x256C|\x254C)(?:r|\x2572|\x2552)(?:p|\x2570|\x2550)(?:c|\x2563|\x2543)(?:\.|\x252E)(?:p|\x2570|\x2550)(?:h|\x2568|\x2548)(?:p|\x2570|\x2550)(?:(?:/|\x252F)+\S*)?(?:[?&]\S*)?"]
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-auth]
# Requests refused with 401 or 403: ten in ten minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-auth
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 10
findtime  = 10m
bantime   = 1h

[agensio-scan]
# Paths that do not exist: forty in five minutes bans for an hour.
enabled   = true
port      = 80,443
filter    = agensio-scan
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 40
findtime  = 5m
bantime   = 1h

[agensio-post]
# POST requests to any path, the catch-all for an unnamed login: 120 in two minutes bans for
# half an hour. An API posted to that often: filter = agensio-post[ignore="/api/|/jsonrpc\.php"].
enabled   = true
port      = 80,443
filter    = agensio-post
logpath   = /var/log/agensio/access.log
banaction = nftables-multiport
maxretry  = 120
findtime  = 2m
bantime   = 30m
