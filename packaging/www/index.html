<h1>agensio is running</h1>
<p>This is the default site from <code>/etc/agensio/sites.d/default.toml</code>, serving
<code>/var/www/html</code>. Add a file per site under <code>/etc/agensio/sites.d/</code>,
check it with <code>agensio -t</code> and apply it with <code>agensio reload</code>.</p>
<p>Documentation: <a href="https://github.com/YiannisBourkelis/agensio">github.com/YiannisBourkelis/agensio</a></p>
