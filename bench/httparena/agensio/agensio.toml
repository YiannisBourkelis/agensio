# agensio for HttpArena: one process, the arena's four listeners. 8080 plain HTTP/1.1
# (baseline, pipelined, short-lived), 8081 TLS kept at HTTP/1.1 (json-tls, static-tls measure
# h1 on the wire, so ALPN must not offer h2 there), 8082 plain with the HTTP/2 preface
# (baseline-h2c, json-h2c), 8443 TLS with h2 (baseline-h2, static-h2). `workers = 0` is one
# per CPU of the container's cpuset. /static/ is the mounted asset directory, everything
# else the benchmark handler (bench/httparena in the agensio repository).
[server]
workers = 0
idle_timeout = 65
max_requests_per_connection = 0
reuse_port = "auto"
tcp_nodelay = true
sendfile = true
protocols = ["h1"]
pid_file = ""

[log]
access = "off"
error = "stderr"

[cache]
max_file_size = "4MB"
max_size = "256MB"

[[site]]
server_name = ["localhost"]
listen = ["0.0.0.0:8080"]
default = true
root = "/srv/www"

[[site.location]]
path = "/static/"
alias = "/data/static/"

[[site.location]]
path = "/"
handler = "httparena"
httparena = { dataset = "/data/dataset.json" }

[[site]]
server_name = ["localhost"]
listen = ["0.0.0.0:8081"]
default = true
root = "/srv/www"
tls = { cert = "/run/agensio/server.crt", key = "/run/agensio/server.key" }

[[site.location]]
path = "/static/"
alias = "/data/static/"

[[site.location]]
path = "/"
handler = "httparena"
httparena = { dataset = "/data/dataset.json" }

[[site]]
server_name = ["localhost"]
listen = ["0.0.0.0:8082"]
default = true
root = "/srv/www"
protocols = ["h2c", "h1"]

[[site.location]]
path = "/static/"
alias = "/data/static/"

[[site.location]]
path = "/"
handler = "httparena"
httparena = { dataset = "/data/dataset.json" }

[[site]]
server_name = ["localhost"]
listen = ["0.0.0.0:8443"]
default = true
root = "/srv/www"
protocols = ["h2", "h1"]
tls = { cert = "/run/agensio/server.crt", key = "/run/agensio/server.key" }

[[site.location]]
path = "/static/"
alias = "/data/static/"

[[site.location]]
path = "/"
handler = "httparena"
httparena = { dataset = "/data/dataset.json" }
