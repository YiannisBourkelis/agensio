# agensio for HttpArena, the 8443 listener: h2 through ALPN, h1 for a client that does
# not offer it (baseline-h2, static-h2). See h1.toml for why this is its own process.
[server]
workers = @WORKERS@
idle_timeout = 65
max_requests_per_connection = 0
reuse_port = "auto"
tcp_nodelay = true
sendfile = true
protocols = ["h2", "h1"]
pid_file = ""

[log]
access = "off"
error = "stderr"

[cache]
max_file_size = "4MB"
max_size = "256MB"

[[site]]
server_name = ["localhost"]
listen = ["0.0.0.0:8443"]
default = true
root = "/srv/www"
tls = { cert = "/run/agensio/server.crt", key = "/run/agensio/server.key" }

[[site.location]]
path = "/static/"
alias = "/data/static/"

[[site.location]]
path = "/pipeline"
match = "exact"
try_files = ["/pipeline.txt"]
