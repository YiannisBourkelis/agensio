# agensio template for the benchmark. bench/run.sh substitutes @WORKERS@ and writes the
# result to bench/tmp/agensio.toml (paths there are absolute).
[server]
workers = @WORKERS@
idle_timeout = 65
max_requests_per_connection = 1000000   # parity with nginx keepalive_requests in bench/nginx.conf
reuse_port = "auto"
tcp_nodelay = true
sendfile = true

[log]
access = "@ACCESS_LOG@"   # off in the benchmark (nginx and Caddy bench configs log nothing either); ACCESS_LOG=path to measure

[cache]
max_file_size = "4MB"
max_size = "256MB"
sendfile_min_size = "@SENDFILE_MIN@"

[[site]]
server_name = ["localhost", "127.0.0.1"]
listen = ["127.0.0.1:8080"]
root = "@BENCH@/www"
default = true

[[site]]
server_name = ["localhost", "127.0.0.1"]
listen = ["127.0.0.1:8443"]
default = true   # the benchmark clients send no SNI for an IP address: this site takes every name
root = "@BENCH@/www"
tls = { cert = "@BENCH@/certs/cert.pem", key = "@BENCH@/certs/key.pem" }
