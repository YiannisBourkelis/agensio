# nginx template for the benchmark, tuned for static files. bench/run.sh substitutes
# @WORKERS@ and @BENCH@ and writes the result to bench/tmp/nginx.conf.
worker_processes @WORKERS@;
worker_rlimit_nofile 65536;
error_log @BENCH@/tmp/nginx-error.log warn;
pid @BENCH@/tmp/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    types {
        text/html                 html htm;
        text/css                  css;
        text/javascript           js;
        application/json          json;
        image/png                 png;
        image/jpeg                jpg jpeg;
        application/octet-stream  bin;
    }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    sendfile on;
    sendfile_max_chunk 1m;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000000;
    reset_timedout_connection on;
    lingering_close off;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;
    ssl_buffer_size 16k;

    server {
        listen 127.0.0.1:8081 backlog=4096;
        listen 127.0.0.1:8444 ssl backlog=4096;
        server_name localhost;
        ssl_certificate @BENCH@/certs/cert.pem;
        ssl_certificate_key @BENCH@/certs/key.pem;
        root @BENCH@/www;
        index index.html;
    }
}
