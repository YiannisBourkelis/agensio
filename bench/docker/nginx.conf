# nginx config for the container benchmark: one worker, tuned for static files (same as bench/nginx.conf).
worker_processes 1;
worker_rlimit_nofile 65536;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 16384; multi_accept on; }
http {
    types { text/html html htm; text/css css; text/javascript js; application/octet-stream bin; }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on; sendfile_max_chunk 1m; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65; keepalive_requests 1000000;
    reset_timedout_connection on; lingering_close off;
    open_file_cache max=10000 inactive=60s; open_file_cache_valid 60s; open_file_cache_min_uses 1; open_file_cache_errors on;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m; ssl_session_timeout 1d; ssl_session_tickets on; ssl_buffer_size 16k;
    server {
        listen 80 backlog=4096;
        listen 443 ssl backlog=4096;
        ssl_certificate /bench/certs/cert.pem;
        ssl_certificate_key /bench/certs/key.pem;
        root /bench/www;
        index index.html;
    }
}
