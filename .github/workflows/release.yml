name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  packages:
    runs-on: ubuntu-22.04   # oldest glibc we build against: the .deb runs on Debian 12+, Ubuntu 22.04+
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 22.04 ships CMake 3.22, GCC 11 and asio 1.18: too old for this project. A
      # recent CMake comes from the action, GCC 12 from the distribution, and asio is
      # fetched by CMake (asio-1-38-2) because no libasio-dev is installed.
      - uses: lukka/get-cmake@latest
      - name: dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-12 libssl-dev zlib1g-dev rpm dpkg-dev file
      - name: configure and build
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: unit tests
        run: build/agensio_tests
      - name: version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"; ver="$(build/agensio -v | awk '{print $2}')"
          [ "$tag" = "$ver" ] || { echo "tag $tag but binary says $ver: set AGENSIO_VERSION_STRING"; exit 1; }
      - name: packages
        run: cd build && cpack -G DEB && cpack -G RPM && ls -la *.deb *.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: build/*.rpm
          retention-days: 3
      - uses: actions/upload-artifact@v4  # the APT repository's stable suite (the apt job)
        with:
          name: deb-stable
          path: build/agensio_*_amd64.deb
          retention-days: 3
      - name: smoke-install the .deb
        run: |
          sudo dpkg -i build/agensio_*.deb
          # /usr/sbin is not on the runner's PATH, and /etc/agensio is 0750 root:agensio, so
          # everything that looks inside it runs through sudo.
          id agensio
          sudo test -f /etc/agensio/agensio.toml
          sudo test -f /etc/agensio/sites.d/default.toml
          sudo /usr/sbin/agensio -t -c /etc/agensio/agensio.toml
          /usr/sbin/agensio -v
          systemctl --no-pager status agensio || true
          sudo systemctl stop agensio || true
      - name: create the release if the tag has none, then attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
        # The version's section of CHANGELOG.md becomes the release notes; the debian13 job, which
        # runs beside this one, creates the release instead if it finishes first.
        run: packaging/release-upload.sh build/*.deb build/*.rpm

  debian13:
    # The .deb built on Debian 13 against its own OpenSSL 3.5, so it serves HTTP/3; the packages
    # job's, built on Ubuntu 22.04 to install on Debian 12 and Ubuntu 22.04 and later, has none
    # (their OpenSSL 3.0 has no QUIC TLS API). Its version carries +deb13
    # (agensio_<version>+deb13_amd64.deb), so the release's two files differ; it installs on
    # Debian 13 and later only. It runs beside the packages job, which never waits for it:
    # whichever finishes first creates the release (packaging/release-upload.sh).
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake ninja-build g++ libssl-dev zlib1g-dev libcrypt-dev dpkg-dev file gh openssl
      - uses: actions/checkout@v4
      - name: configure and build
        # asio is fetched by CMake (asio-1-38-2): Debian 13's libasio-dev is older than the project needs.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAGENSIO_DEB_SUFFIX=deb13 && cmake --build build
      - name: unit tests
        run: build/agensio_tests
      - name: version matches the tag, and the build serves HTTP/3
        run: |
          tag="${GITHUB_REF_NAME#v}"; ver="$(build/agensio -v | awk '{print $2}')"
          [ "$tag" = "$ver" ] || { echo "tag $tag but binary says $ver: set AGENSIO_VERSION_STRING"; exit 1; }
          # A build without the QUIC TLS API refuses "h3" in protocols; this one must load it.
          d=$(mktemp -d); mkdir "$d/www"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 1 -subj /CN=localhost -keyout "$d/key.pem" -out "$d/cert.pem" 2>/dev/null
          printf '[server]\nprotocols = ["h3", "h2", "h1"]\n[log]\naccess = "off"\n[[site]]\nserver_name = ["localhost"]\nlisten = ["127.0.0.1:8443"]\nroot = "%s/www"\ntls = { cert = "%s/cert.pem", key = "%s/key.pem" }\n' "$d" "$d" "$d" > "$d/h3.toml"
          build/agensio -t -c "$d/h3.toml"
      - name: package
        run: cd build && cpack -G DEB && ls -la *.deb
      - uses: actions/upload-artifact@v4  # the APT repository's trixie suite (the apt job)
        with:
          name: deb-trixie
          path: build/agensio_*+deb13_amd64.deb
          retention-days: 3
      - name: smoke-install the .deb
        run: |
          apt-get install -y ./build/agensio_*+deb13_amd64.deb
          id agensio
          test -f /etc/agensio/agensio.toml && test -f /etc/agensio/sites.d/default.toml
          /usr/sbin/agensio -t -c /etc/agensio/agensio.toml
          /usr/sbin/agensio -v
      - name: attach to the release (creating it if the packages job has not yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # In the container the checkout belongs to another uid and git refuses to read it.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          packaging/release-upload.sh build/agensio_*+deb13_amd64.deb

  apt:
    # The signed APT repository on GitHub Pages (packaging/apt-repo.sh, docs/install.md): the suite
    # "stable" with the packages job's .deb, "trixie" with the debian13 job's. It waits for both, so
    # the release's files still go up as soon as each job ends, and the repository follows once.
    # The site as published (the gh-pages branch) gives the previous release, which each suite keeps
    # beside the new one; the branch is replaced by one commit each time, so old packages leave its
    # history too. Skipped until the APT_GPG_PRIVATE_KEY secret exists (packaging/README.md).
    needs: [packages, debian13]
    runs-on: ubuntu-24.04
    container: debian:trixie
    env:
      # `secrets` cannot be read in a step's `if`; the job env carries the answer instead.
      HAVE_APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}
    steps:
      - name: tools
        if: ${{ env.HAVE_APT_KEY == 'true' }}
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git gnupg apt-utils dpkg-dev
      - uses: actions/checkout@v4
        if: ${{ env.HAVE_APT_KEY == 'true' }}
      - uses: actions/download-artifact@v4
        if: ${{ env.HAVE_APT_KEY == 'true' }}
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true
      - name: build the repository on the published one and publish it (gh-pages)
        if: ${{ env.HAVE_APT_KEY == 'true' }}
        shell: bash
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export GNUPGHOME=$(mktemp -d)
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # The previous release from the branch; none on the first run, but a branch that exists
          # and cannot be read stops the job rather than publish without it.
          rc=0; git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null || rc=$?
          case $rc in
            0) git clone -q --depth 1 --branch gh-pages "$remote" previous ;;
            2) mkdir previous ;;
            *) echo "cannot read the gh-pages branch (git ls-remote exited $rc)"; exit 1 ;;
          esac
          packaging/apt-repo.sh --out site --key "$key" --previous previous debs/*.deb
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "APT repository for $GITHUB_REF_NAME"
          git push -q --force "$remote" gh-pages

  arch:
    # A binary pacman package from packaging/arch/PKGBUILD, built in an Arch container and
    # attached to the release: `sudo pacman -U ./agensio-*.pkg.tar.zst` on Arch, Omarchy,
    # Manjaro, EndeavourOS. The AUR entry, when it exists, is the update path.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja asio openssl zlib github-cli sudo
      - uses: actions/checkout@v4
      - name: build the package (makepkg refuses to run as root, so a build user does it)
        run: |
          useradd -m build && echo 'build ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/build
          cp -r packaging/arch /home/build/arch && chown -R build /home/build/arch
          cd /home/build/arch
          sudo -u build makepkg -s --noconfirm
          ls -la *.pkg.tar.zst
      - name: version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"; grep -q "^_tag=$tag$" packaging/arch/PKGBUILD || { echo "PKGBUILD _tag is not $tag"; exit 1; }
      - name: smoke-install
        run: |
          pacman -U --noconfirm /home/build/arch/agensio-[0-9]*.pkg.tar.zst   # not the -debug package
          id agensio && test -f /etc/agensio/agensio.toml && test -f /usr/lib/systemd/system/agensio.service
          grep -q '/usr/bin/agensio' /usr/lib/systemd/system/agensio.service
          /usr/bin/agensio -t -c /etc/agensio/agensio.toml && /usr/bin/agensio -v
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # In the container the checkout belongs to another uid and git refuses to read it;
          # naming the repository keeps gh away from git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          for _ in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 20; done  # the packages job creates it
          gh release upload "$GITHUB_REF_NAME" /home/build/arch/agensio-[0-9]*.pkg.tar.zst --clobber -R "$GITHUB_REPOSITORY"

  fedora:
    # The RPM built by the packages job, installed on a current Fedora: account, files,
    # unit, the packaged configuration accepted. Nothing is uploaded from here.
    needs: packages
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpm
          path: rpm
      - name: smoke-install
        run: |
          dnf install -y rpm/agensio-*.rpm
          id agensio
          test -f /etc/agensio/agensio.toml && test -f /etc/agensio/sites.d/default.toml
          test -f /usr/lib/systemd/system/agensio.service && test -f /etc/logrotate.d/agensio
          /usr/sbin/agensio -t -c /etc/agensio/agensio.toml
          /usr/sbin/agensio -v
          rpm -qi agensio | grep -E '^(Version|Release)'
