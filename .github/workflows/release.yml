name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  packages:
    runs-on: ubuntu-22.04   # oldest glibc we build against: the .deb runs on Debian 12+, Ubuntu 22.04+
    env:
      # `secrets` cannot be read in a step's `if`; the job env carries the answer instead.
      HAVE_APT_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      # Ubuntu 22.04 ships CMake 3.22, GCC 11 and asio 1.18: too old for this project. A
      # recent CMake comes from the action, GCC 12 from the distribution, and asio is
      # fetched by CMake (asio-1-38-2) because no libasio-dev is installed.
      - uses: lukka/get-cmake@latest
      - name: dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-12 libssl-dev rpm dpkg-dev file
      - name: configure and build
        env:
          CC: gcc-12
          CXX: g++-12
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: unit tests
        run: build/agensio_tests
      - name: version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"; ver="$(build/agensio -v | awk '{print $2}')"
          [ "$tag" = "$ver" ] || { echo "tag $tag but binary says $ver: set AGENSIO_VERSION_STRING"; exit 1; }
      - name: packages
        run: cd build && cpack -G DEB && cpack -G RPM && ls -la *.deb *.rpm
      - name: smoke-install the .deb
        run: |
          sudo dpkg -i build/agensio_*.deb
          # /usr/sbin is not on the runner's PATH, and /etc/agensio is 0750 root:agensio, so
          # everything that looks inside it runs through sudo.
          id agensio
          sudo test -f /etc/agensio/agensio.toml
          sudo test -f /etc/agensio/sites.d/default.toml
          sudo /usr/sbin/agensio -t -c /etc/agensio/agensio.toml
          /usr/sbin/agensio -v
          systemctl --no-pager status agensio || true
          sudo systemctl stop agensio || true
      - name: create the release if the tag has none, then attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section of CHANGELOG.md becomes the release notes.
          awk -v v="$version" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            pre=""; case "$version" in *-*) pre="--prerelease";; esac
            gh release create "$GITHUB_REF_NAME" $pre --title "$version" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" build/*.deb build/*.rpm --clobber
      - name: build the APT repository
        if: ${{ env.HAVE_APT_KEY == 'true' }}
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          mkdir -p site/apt/pool/main site/apt/dists/stable/main/binary-amd64
          cp build/*.deb site/apt/pool/main/
          cd site/apt
          dpkg-scanpackages --arch amd64 pool/ > dists/stable/main/binary-amd64/Packages
          gzip -k9 dists/stable/main/binary-amd64/Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin=agensio -o APT::FTPArchive::Release::Label=agensio \
            -o APT::FTPArchive::Release::Suite=stable -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 -o APT::FTPArchive::Release::Components=main \
            release dists/stable > dists/stable/Release
          gpg --batch --yes -u "$keyid" -abs -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes -u "$keyid" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --armor --export "$keyid" > ../agensio.gpg
          cd ../..
          printf '<h1>agensio packages</h1><p>APT: see docs/install.md</p>' > site/index.html
      - name: publish the APT repository (GitHub Pages)
        if: ${{ env.HAVE_APT_KEY == 'true' }}
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true

  arch:
    # A binary pacman package from packaging/arch/PKGBUILD, built in an Arch container and
    # attached to the release: `sudo pacman -U ./agensio-*.pkg.tar.zst` on Arch, Omarchy,
    # Manjaro, EndeavourOS. The AUR entry, when it exists, is the update path.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: dependencies
        run: pacman -Syu --noconfirm --needed base-devel git cmake ninja asio openssl github-cli sudo
      - uses: actions/checkout@v4
      - name: build the package (makepkg refuses to run as root, so a build user does it)
        run: |
          useradd -m build && echo 'build ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/build
          cp -r packaging/arch /home/build/arch && chown -R build /home/build/arch
          cd /home/build/arch
          sudo -u build makepkg -s --noconfirm
          ls -la *.pkg.tar.zst
      - name: version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"; grep -q "^_tag=$tag$" packaging/arch/PKGBUILD || { echo "PKGBUILD _tag is not $tag"; exit 1; }
      - name: smoke-install
        run: |
          pacman -U --noconfirm /home/build/arch/agensio-[0-9]*.pkg.tar.zst   # not the -debug package
          id agensio && test -f /etc/agensio/agensio.toml && test -f /usr/lib/systemd/system/agensio.service
          grep -q '/usr/bin/agensio' /usr/lib/systemd/system/agensio.service
          /usr/bin/agensio -t -c /etc/agensio/agensio.toml && /usr/bin/agensio -v
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3 4 5 6; do gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break; sleep 20; done  # the packages job creates it
          gh release upload "$GITHUB_REF_NAME" /home/build/arch/agensio-[0-9]*.pkg.tar.zst --clobber
