# Build and test on Ubuntu and macOS. Not run on every push: a release tag runs
# release.yml, which builds and tests the tagged commit before packaging; this workflow
# is for a pull request or a manual run from the Actions tab (Run workflow) when a
# change should be checked on both platforms before it is tagged.
name: ci
on:
  workflow_dispatch:
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libasio-dev libssl-dev zlib1g-dev
      - name: dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja asio openssl@3
      - name: configure and build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: unit tests
        run: build/agensio_tests
      - name: integration (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y curl netcat-openbsd && tests/integration.sh build/agensio
